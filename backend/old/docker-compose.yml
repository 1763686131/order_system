version: '3'

services:
  order-board:
    image: python:3.10-slim
    container_name: nas_order_board
    ports:
      - "7899:7899"
    volumes:
      - /vol2/1000/Docker/order_system/backend:/app
      - /vol2/1000/Docker/order_system/data:/app/data
      - /vol2/1000/Docker/order_system/uploads:/app/uploads
      - /vol2/1000/Docker/order_system/frontend:/app/frontend
      # 将 NAS 上的检测报告目录挂载到容器后，再在“系统设置”中填写容器内路径。
      # 示例：- /vol2/1000/检测报告:/mnt/nas/reports
    working_dir: /app
    environment:
      - TZ=Asia/Shanghai
      # 生产环境应在 .env 中设置固定随机密钥，避免容器重启后登录会话失效。
      - APP_SECRET_KEY=${APP_SECRET_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-0}
      # 仅在可信反向代理已覆盖 X-Forwarded-For 时设为 1。
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-0}
      # 目录选择器初始可浏览的容器目录；可按 NAS 实际挂载点调整。
      - REPORTS_BROWSE_ROOTS=/mnt,/media,/volume1,/data,/app/uploads
    command: sh -c "pip install flask flask-cors -i https://pypi.tuna.tsinghua.edu.cn/simple && python app.py"
    restart: always
